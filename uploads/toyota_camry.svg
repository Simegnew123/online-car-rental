<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 300" width="660" height="300">
  <defs>
    <linearGradient id="bodyGrad_toyota_camry.svg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f"/>
      <stop offset="60%" style="stop-color:#1e3a5f"/>
      <stop offset="100%" style="stop-color:#0f1f3a"/>
    </linearGradient>
    <linearGradient id="windowGrad_toyota_camry.svg" x1="0%" y1="0%" x2="0%" y2="100%">
